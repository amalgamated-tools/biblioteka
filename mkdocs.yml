site_name: Biblioteka
site_description: A self-hosted personal book library manager
site_url: https://amalgamated-tools.github.io/biblioteka/
repo_url: https://github.com/amalgamated-tools/biblioteka
repo_name: amalgamated-tools/biblioteka

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Deployment: deployment.md
      - Authentication: authentication.md
      - Administration: administration.md
  - User Guides:
      - OPDS Catalog: opds.md
      - Kobo Sync: kobo.md
      - KOReader Sync: koreader.md
      - Metadata: metadata.md
  - Developer Reference:
      - API Overview: api.md
      - API Reference: api-reference.md
      - Database Schema: database-schema.md
      - Frontend: frontend.md
      - Background Jobs: background-jobs.md
      - Observability: observability.md

exclude_docs:
  - docs.go
  - swagger.json
  - swagger.yaml
