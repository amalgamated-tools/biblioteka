site_name: Biblioteka
site_description: A self-hosted personal book library manager
site_url: https://amalgamated-tools.github.io/biblioteka/
repo_url: https://github.com/amalgamated-tools/biblioteka
repo_name: amalgamated-tools/biblioteka

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Deployment: deployment.md
      - Cloud Platforms:
          - Fly.io: deploy-flyio.md
          - Render: deploy-render.md
          - Railway: deploy-railway.md
      - Authentication: authentication.md
      - Administration: administration.md
  - User Guides:
      - OPDS Catalog: opds.md
      - Kobo Sync: kobo.md
      - KOReader Sync: koreader.md
      - Reading Groups: reading-groups.md
      - Metadata: metadata.md
      - Migrate from Calibre: calibre.md
      - Tags: tags.md
  - Developer Reference:
      - API Overview: api.md
      - API Reference:
          - Overview: api-reference.md
          - Auth & API Keys: api/auth.md
          - Config: api/config.md
          - Admin: api/admin.md
          - Libraries: api/libraries.md
          - Authors: api/authors.md
          - Series: api/series.md
          - Tags: api/tags.md
          - Books & Files: api/books.md
          - OPDS: api/opds.md
          - Kobo & KOSync: api/kobo.md
          - Reading Lists: api/reading-lists.md
          - Reading Groups: api/reading-groups.md
          - Stats & Recommendations: api/stats.md
      - Database Schema: database-schema.md
      - Frontend: frontend.md
      - Background Jobs: background-jobs.md
      - Observability: observability.md

exclude_docs: |
  swagger/**
