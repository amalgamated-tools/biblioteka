query GetBookByAsin($asin: String!) {
  getBookByAsin(asin: $asin) {
    work {
      id
      legacyId
      details {
        webUrl
        originalTitle
      }
      bestBook {
        id
        legacyId
        imageUrl
        title
              details {
                asin
                isbn
                isbn13
                language {
                  name
                }
                numPages
              }        
        primaryContributorEdge {
          role
          node {
                  id
                  name
                  legacyId
                  profileImageUrl
          }
        }
      }
    }
  }
}

