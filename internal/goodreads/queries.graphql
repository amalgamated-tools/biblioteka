query Search($query: String!) {
  getSearchSuggestions(query: $query) {
    totalCount
    edges {
      ... on SearchBookEdge {
        node {
          work {
            id
            legacyId
            bestBook {
              id
              legacyId
              imageUrl
              title
              details {
                asin
                isbn
                isbn13
                language {
                  name
                  __typename
                }
                numPages
                __typename
              }
              primaryContributorEdge {
                role
                node {
                  id
                  name
                  legacyId
                  profileImageUrl
                  __typename
                }
              }
              __typename
            }
            __typename
          }
        }
      }
    }
  }
}
