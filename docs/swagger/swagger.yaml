basePath: /api
definitions:
  calibre.ImportResult:
    properties:
      errors:
        description: Errors is the number of books that could not be imported due
          to errors.
        type: integer
      imported:
        description: Imported is the number of books successfully written to the database.
        type: integer
      skipped:
        description: |-
          Skipped is the number of books not written because they were already
          present (detected by file path).
        type: integer
      total:
        description: Total is the total number of Calibre books examined.
        type: integer
    type: object
  calibre.Preview:
    properties:
      books:
        description: |-
          Books contains up to previewLimit books for display. The caller should
          use Total to inform the user about books beyond the preview window.
        items:
          $ref: '#/definitions/calibre.PreviewBook'
        type: array
      total:
        description: Total is the total number of books found in the Calibre database.
        type: integer
    type: object
  calibre.PreviewBook:
    properties:
      authors:
        items:
          type: string
        type: array
      calibre_id:
        type: integer
      formats:
        items:
          type: string
        type: array
      isbn10:
        type: string
      isbn13:
        type: string
      publication_date:
        type: string
      publisher:
        type: string
      series:
