updates:
- directory: /
  groups:
    go-minor-patch:
      update-types:
      - minor
      - patch
  package-ecosystem: gomod
  schedule:
    interval: weekly
- directory: /frontend
  groups:
    npm-minor-patch:
      update-types:
      - minor
      - patch
  package-ecosystem: npm
  schedule:
    interval: weekly
- directory: /
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: "github/gh-aw-actions/**"
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: weekly
version: 2
