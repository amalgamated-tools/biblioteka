name: Auto-label docs-only PRs
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check-docs-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

       - name: Evaluate if PR is docs-only
         id: evaluate
         run: |
           # Short-circuit in GitHub expression so push events never access
           # github.event.pull_request (which doesn't exist on push events)
           if [[ "${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'docs-only') }}" == "true" ]]; then
             echo "is-docs-only=true" >> $GITHUB_OUTPUT
           else
             echo "is-docs-only=false" >> $GITHUB_OUTPUT
           fi
           
           # Get list of changed files in this PR (only on pull_request events)
           if [[ "${{ github.event_name }}" == "pull_request" ]]; then
             BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
             git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
             git diff --name-only "$BASE_REF"...HEAD > /tmp/changed_files.txt
             
             # Check if all changed files are documentation-related
             # Exclude: cmd/, internal/, frontend/, db/, e2e/, go.mod, go.sum, .golangci.yml, lock files,
             # and repo-root package/config/lock files that can affect builds
             FILES_IS_DOCS=true
             while IFS= read -r file; do
               # Skip if file matches code paths or is a code/config file
               if [[ "$file" =~ ^(cmd|internal|frontend|db|e2e)/ ]] || \
                  [[ "$file" =~ \.(go|ts|tsx|js|jsx|mod|sum|yml|yaml)$ ]] || \
                  [[ "$file" =~ ^\.github/workflows/ ]] || \
                  [[ "$file" =~ ^(package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml)$ ]]; then
                 FILES_IS_DOCS=false
                 echo "Found code file: $file"
                 break
               fi
             done < /tmp/changed_files.txt
             
             # Print summary
             echo "Files are docs-only: $FILES_IS_DOCS"
             
             # PR is docs-only ONLY if all changed files are documentation AND
             # if the label check passed (label takes precedence over file analysis)
             if [[ "$FILES_IS_DOCS" == "true" ]]; then
               echo "is-docs-only=true" >> $GITHUB_OUTPUT
             else
               echo "is-docs-only=false" >> $GITHUB_OUTPUT
             fi
           fi

      - name: Apply docs-only label
        if: steps.evaluate.outputs.is-docs-only == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['docs-only']
            });
            console.log('✅ Applied docs-only label');

      - name: Remove docs-only label
        if: steps.evaluate.outputs.is-docs-only == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'docs-only'
              });
              console.log('✅ Removed docs-only label');
            } catch (error) {
              if (error.status === 404) {
                console.log('ℹ️  Label not present, nothing to remove');
              } else {
                throw error;
              }
            }
