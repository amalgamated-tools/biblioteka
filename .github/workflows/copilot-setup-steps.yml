name: "Copilot Setup Steps"

# Run automatically when this file changes to validate the setup,
# and allow manual testing from the repository's "Actions" tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@5c2fe865bb4dc46e1450f6ee0d0541d759aea73a # v0.79.6
        with:
          version: v0.79.6

      # ── Go ────────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: 1.26.2
          cache: true
          cache-dependency-path: go.sum

      - name: Pre-warm Go module cache
        run: go mod download

      # ── ExifTool ──────────────────────────────────────────────────────────
      - name: Cache exiftool apt package
        id: exiftool-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/apt-cache
          # Stable key tied to the OS only; bump the version suffix (v1 → v2)
          # only when a different exiftool version is intentionally required.
          key: ${{ runner.os }}-apt-exiftool-v1
          restore-keys: |
            ${{ runner.os }}-apt-exiftool-

      - name: Install exiftool
        run: |
          mkdir -p "${{ runner.temp }}/apt-cache"
          if [ "${{ steps.exiftool-cache.outputs.cache-hit }}" = "true" ]; then
            sudo apt-get -o dir::cache::archives="${{ runner.temp }}/apt-cache" install -y -q --no-download libimage-exiftool-perl
          else
            sudo apt-get update -qq
            sudo apt-get -o dir::cache::archives="${{ runner.temp }}/apt-cache" install -y -q libimage-exiftool-perl
          fi
          exiftool -ver

      # ── Frontend ──────────────────────────────────────────────────────────
      # pnpm must be set up before setup-node so the node cache can locate the pnpm store.
      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile
