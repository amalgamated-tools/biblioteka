name: Test

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'db/**'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'db/**'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/test.yml'

permissions:
  # Required: allow read access to the content for analysis.
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  pull-requests: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend Build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm must be set up before setup-node so the node cache can locate the pnpm store
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

  frontend-checks:
    runs-on: ubuntu-latest
    name: Frontend Checks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm must be set up before setup-node so the node cache can locate the pnpm store
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        working-directory: ./frontend
        run: pnpm run check

      - name: Check formatting
        working-directory: ./frontend
        run: |
          pnpm exec prettier --check . || {
            echo "Frontend files are not formatted. Please run 'pnpm run format'"
            exit 1
          }

      - name: Run ESLint
        working-directory: ./frontend
        run: pnpm run lint

      - name: Run frontend tests
        working-directory: ./frontend
        run: pnpm run test
        
  frontend-all:
    needs: [frontend-build, frontend-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all frontend jobs passed
        run: |
          if [[ "${{ needs.frontend-build.result }}" != "success" || "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "One or more frontend jobs failed"
            exit 1
          fi


  # Lint and test run fully in parallel with frontend-build; the dist placeholder
  # (.gitkeep) in internal/server/dist satisfies //go:embed all:dist for compilation.
  go-lint:
    runs-on: ubuntu-latest
    name: Go Lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: 1.26.1
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.11.3

      - name: Check Go formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Go files are not formatted. Please run 'go fmt ./...'"
            gofmt -d .
            exit 1
          fi

  go-test:
    runs-on: ubuntu-latest
    name: Go Tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: 1.26.1
          cache: true
          cache-dependency-path: go.sum

      - run: go version

      - name: Cache exiftool apt package
        id: exiftool-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ runner.os }}-apt-exiftool-${{ hashFiles('.github/workflows/test.yml') }}

      - name: Install exiftool
        run: |
          mkdir -p "${{ runner.temp }}/apt-cache"
          if [ "${{ steps.exiftool-cache.outputs.cache-hit }}" = "true" ]; then
            sudo dpkg -i "${{ runner.temp }}/apt-cache"/*.deb
          else
            sudo apt-get update -qq
            sudo apt-get -o dir::cache::archives="${{ runner.temp }}/apt-cache" install -y -q libimage-exiftool-perl
          fi
          exiftool -ver

      - name: Run Go tests
        run: go test -v ./...

  go-all:
    needs: [go-lint, go-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all Go jobs passed
        run: |
          if [[ "${{ needs.go-lint.result }}" != "success" || "${{ needs.go-test.result }}" != "success" ]]; then
            echo "One or more Go jobs failed"
            exit 1
          fi
