name: Test

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'db/**'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'db/**'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/test.yml'

permissions:
  # Required: allow read access to the content for analysis.
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  pull-requests: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend Build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm must be set up before setup-node so the node cache can locate the pnpm store
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dist
          path: internal/server/dist

  frontend-checks:
    runs-on: ubuntu-latest
    name: Frontend Checks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm must be set up before setup-node so the node cache can locate the pnpm store
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        working-directory: ./frontend
        run: pnpm run check

      - name: Check formatting
        working-directory: ./frontend
        run: |
          pnpm run format --check || {
            echo "Frontend files are not formatted. Please run 'pnpm run format'"
            exit 1
          }

      - name: Run frontend tests
        working-directory: ./frontend
        run: pnpm run test
        
  frontend-all:
    needs: [frontend-build, frontend-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all frontend jobs passed
        run: |
          if [[ "${{ needs.frontend-build.result }}" != "success" || "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "One or more frontend jobs failed"
            exit 1
          fi


  go-tests:
    needs: frontend-build
    runs-on: ubuntu-latest
    name: Go Tests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: internal/server/dist

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum
      
      - run: go version

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.11.3

      - name: Run Go tests
        run: go test -v ./...

      - name: Check Go formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Go files are not formatted. Please run 'go fmt ./...'"
            gofmt -d .
            exit 1
          fi
