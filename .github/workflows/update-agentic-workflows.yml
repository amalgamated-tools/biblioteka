name: Update Agentic Workflows

on:
  schedule:
    - cron: "0 4 * * *"  # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gh-aw CLI (latest)
        uses: github/gh-aw-actions/setup-cli@2f59ed406d4312033dd7fd693097956ffa6a3c43
        with:
          version: latest

      - name: Compile agentic workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh aw compile

      - name: Commit updated workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain .github/workflows/)" ]; then
            echo "No workflow changes to commit."
          else
            git checkout -b update-agentic-workflows-$(date +%Y%m%d%H%M%S)
            git add .github/workflows/
            git commit -m "chore(workflows): recompile agentic workflows [skip ci]"
            git push --set-upstream origin update-agentic-workflows-$(date +%Y%m%d%H%M%S)
            gh pr create --fill --title "chore(workflows): recompile agentic workflows [skip ci]" --body "Automated recompilation of agentic workflows."
          fi
