name: Update Agentic Workflows

on:
  schedule:
    - cron: "0 4 * * *"  # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade gh-aw extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension upgrade github/gh-aw

      - name: Install gh-aw CLI (latest)
        uses: github/gh-aw-actions/setup-cli@f22886a9607f5c27e79742a8bfc5faa34737138b # v0.64.2

      - name: Compile agentic workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh aw compile

      - name: Commit updated workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No workflow changes to commit."
          else
            git add .github/workflows/
            git commit -m "chore(workflows): recompile agentic workflows [skip ci]"
            git push
          fi
