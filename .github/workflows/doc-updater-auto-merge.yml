name: Doc Updater Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'docs(daily):') &&
      contains(github.event.pull_request.labels.*.name, 'documentation') &&
      contains(github.event.pull_request.labels.*.name, 'automation')
    # Approval + auto-merge enable should complete well under 5 minutes.
    # Without a timeout, a hung runner would default to 6 hours.
    timeout-minutes: 5
    steps:
      - name: Auto-approve documentation PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for documentation PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
