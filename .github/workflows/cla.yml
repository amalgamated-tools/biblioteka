name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    if: |
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
       github.event.comment.body == 'recheck') ||
      github.event_name == 'pull_request_target'
    # CLA signature checks should complete in well under 5 minutes.
    # Without a timeout, a hung runner would default to 6 hours.
    timeout-minutes: 5
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/amalgamated-tools/biblioteka/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: >-
            github-actions[bot],
            dependabot-preview[bot],
            dependabot[bot],
            copilot,
            github-copilot[bot],
            copilot[bot],
            Copilot,
            copilot-swe-agent[bot]
