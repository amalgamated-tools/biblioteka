name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'db/**'
      - 'e2e/**'
      - 'go.mod'
      - 'go.sum'
      # docs/docs.go is auto-generated Swagger code imported by internal/server;
      # a bad regeneration would break the Go binary build
      - 'docs/docs.go'
      - '.github/workflows/e2etest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'db/**'
      - 'e2e/**'
      - 'go.mod'
      - 'go.sum'
      # docs/docs.go is auto-generated Swagger code imported by internal/server;
      # a bad regeneration would break the Go binary build
      - 'docs/docs.go'
      - '.github/workflows/e2etest.yml'

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a new push arrives.
# Main branch runs are never cancelled so merge results are always recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E Tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: 1.26.1
          cache: true
          cache-dependency-path: go.sum

      - name: Build Go binary
        run: go build -o biblioteka ./cmd/server

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run e2e tests
        working-directory: ./e2e
        run: pnpm test
        env:
          CI: "true"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: e2e/playwright-report/
          # 3 days is sufficient for post-failure review; saves artifact storage.
          retention-days: 3
