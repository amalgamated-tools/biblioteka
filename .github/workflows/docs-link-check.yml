name: Docs Link Check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'mkdocs.yml'
      - '.mlc_config.json'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'mkdocs.yml'
      - '.mlc_config.json'
      - '.github/workflows/docs-link-check.yml'
    types: [synchronize, opened, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  link-check:
    runs-on: ubuntu-latest
    # markdown-link-check is fast for local-only checks; 5 minutes is generous.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Check markdown links (relative file paths only; same-page anchors and external URLs are excluded — see .mlc_config.json)
        run: |
          find docs -name '*.md' | sort | xargs npx --yes markdown-link-check@3.12.2 \
            --config .mlc_config.json \
            --quiet
