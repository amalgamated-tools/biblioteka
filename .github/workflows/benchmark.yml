name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/pathparser/**'
      - 'internal/db/**'
      - 'internal/metadata/**'
      - 'internal/organize/**'
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress benchmark runs for the same PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    name: Go Benchmarks
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: 1.26.1
          cache: true
          cache-dependency-path: go.sum

      - name: Cache exiftool apt package
        id: exiftool-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ runner.os }}-apt-exiftool-v1
          restore-keys: |
            ${{ runner.os }}-apt-exiftool-

      - name: Install exiftool
        run: |
          mkdir -p "${{ runner.temp }}/apt-cache"
          if [ "${{ steps.exiftool-cache.outputs.cache-hit }}" = "true" ]; then
            sudo apt-get -o dir::cache::archives="${{ runner.temp }}/apt-cache" install -y -q --no-download libimage-exiftool-perl
          else
            sudo apt-get update -qq
            sudo apt-get -o dir::cache::archives="${{ runner.temp }}/apt-cache" install -y -q libimage-exiftool-perl
          fi
          exiftool -ver

      - name: Run benchmarks
        run: |
          set -o pipefail
          go test -bench=. -benchmem -benchtime=3s -run='^$' \
            ./internal/pathparser/... \
            ./internal/db/... \
            ./internal/metadata/... \
            ./internal/organize/... \
            2>&1 | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 90

      - name: Post benchmark comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('benchmark-results.txt', 'utf8');

            // Extract only benchmark lines (lines starting with Benchmark)
            const benchLines = raw.split('\n').filter(l => l.startsWith('Benchmark'));
            const MARKER = '<!-- gh-benchmark-comment -->';
            const body = [
              MARKER,
              '## Benchmark Results',
              '',
              'Results for packages touched by this PR (`-benchtime=3s`).',
              '',
              '```',
              benchLines.length > 0 ? benchLines.join('\n') : 'No benchmarks found in the changed packages.',
              '```',
              '',
              `_Full results are available in the [Actions run for this benchmark](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). To establish a performance baseline, compare these numbers against the \`main\` branch benchmarks._`,
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c =>
                c.user.login === 'github-actions[bot]' && c.body.startsWith(MARKER)
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (e) {
              core.warning(`Could not post benchmark comment: ${e.message}`);
            }
